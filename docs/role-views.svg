  <g font-size="13" fill="#1a1a1a">
    <rect x="896" y="706" width="148" height="28" rx="14" fill="none" stroke="#b4b4b4" stroke-dasharray="4 3"/><text x="912" y="725" fill="#9a9a9a">rules that travel</text>
    <rect x="896" y="740" width="146" height="28" rx="14" fill="none" stroke="#b4b4b4" stroke-dasharray="4 3"/><text x="912" y="759" fill="#9a9a9a">worked examples</text>
    <rect x="896" y="774" width="120" height="28" rx="14" fill="none" stroke="#b4b4b4" stroke-dasharray="4 3"/><text x="912" y="793" fill="#9a9a9a">token index</text>
    <rect x="896" y="808" width="96" height="28" rx="14" fill="none" stroke="#b4b4b4" stroke-dasharray="4 3"/><text x="912" y="827" fill="#9a9a9a">changelog</text>
  </g>

  <line x1="168" y1="1006" x2="1212" y2="1006" stroke="#dcdcdc"/>

  <text x="168" y="1032" font-size="12.5" font-weight="600" fill="#111111">Two ways to change something</text>
  <text x="168" y="1053" font-size="12" fill="#4a4a4a">◆  A supported choice. The system expects you to pick, and you keep receiving updates.</text>
  <text x="168" y="1072" font-size="12" fill="#4a4a4a">Everything else in the shared row can be overridden – you keep your value, and that one property leaves the system.</text>

  <text x="168" y="1110" font-size="12.5" fill="#111111">The builder row is finished. The shared row is the interface. The bottom row is the product, and it is almost entirely unbuilt.</text>
  <text x="168" y="1132" font-size="11.5" fill="#8a8a8a">Light pill = design material.   Dark pill = document or process.   Dashed = does not exist today.</text>
</svg>
