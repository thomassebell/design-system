    <rect x="542" y="284" width="76" height="28" rx="14" fill="#6b6b6b"/><text x="558" y="303" fill="#ffffff">Backlog</text>
  </g>
  <!-- DEVELOPER shared -->
  <g font-size="13" fill="#1a1a1a">
    <rect x="542" y="412" width="180" height="28" rx="14" fill="#e6e6e6"/><text x="558" y="431">semantic CSS variables</text>
    <rect x="542" y="446" width="136" height="28" rx="14" fill="#e6e6e6"/><text x="558" y="465">component props</text>
    <rect x="542" y="480" width="92" height="28" rx="14" fill="#e6e6e6"/><text x="558" y="499">Storybook</text>
    <rect x="542" y="514" width="70" height="28" rx="14" fill="#6b6b6b"/><text x="558" y="533" fill="#ffffff">Guides</text>
    <rect x="542" y="548" width="76" height="28" rx="14" fill="none" stroke="#b4b4b4" stroke-dasharray="4 3"/><text x="558" y="567" fill="#9a9a9a">Recipes</text>
    <line x1="542" y1="626" x2="838" y2="626" stroke="#e0e0e0"/>
    <text x="542" y="645" font-size="11" font-weight="600" fill="#a34a2e">Override is silent, and permanent.</text>
    <text x="542" y="660" font-size="10.5" fill="#8a8a8a">className and style reach inside. No reset.</text>
  </g>
  <!-- DEVELOPER consumer -->
  <g font-size="13" fill="#1a1a1a">
    <rect x="542" y="706" width="120" height="28" rx="14" fill="#e6e6e6"/><text x="558" y="725">npm packages</text>
    <rect x="542" y="740" width="166" height="28" rx="14" fill="#e6e6e6"/><text x="558" y="759">◆  brand stylesheets</text>
    <rect x="542" y="774" width="142" height="28" rx="14" fill="#e6e6e6"/><text x="558" y="793">type definitions</text>
    <rect x="542" y="808" width="96" height="28" rx="14" fill="none" stroke="#b4b4b4" stroke-dasharray="4 3"/><text x="558" y="827" fill="#9a9a9a">changelog</text>
    <rect x="542" y="842" width="130" height="28" rx="14" fill="none" stroke="#b4b4b4" stroke-dasharray="4 3"/><text x="558" y="861" fill="#9a9a9a">getting started</text>
    <rect x="542" y="876" width="128" height="28" rx="14" fill="none" stroke="#b4b4b4" stroke-dasharray="4 3"/><text x="558" y="895" fill="#9a9a9a">upgrade notes</text>
    <rect x="542" y="910" width="96" height="28" rx="14" fill="none" stroke="#b4b4b4" stroke-dasharray="4 3"/><text x="558" y="929" fill="#9a9a9a">roadmap</text>
  </g>

  <!-- AI builder -->
  <g font-size="13" fill="#1a1a1a">
