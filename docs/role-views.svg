  <g font-size="13" fill="#1a1a1a">
    <rect x="896" y="412" width="140" height="28" rx="14" fill="#e6e6e6"/><text x="912" y="431">component types</text>
    <rect x="896" y="446" width="146" height="28" rx="14" fill="#e6e6e6"/><text x="912" y="465">the two READMEs</text>
    <rect x="896" y="480" width="70" height="28" rx="14" fill="none" stroke="#b4b4b4" stroke-dasharray="4 3"/><text x="912" y="499" fill="#9a9a9a">Guides</text>
    <rect x="896" y="514" width="76" height="28" rx="14" fill="none" stroke="#b4b4b4" stroke-dasharray="4 3"/><text x="912" y="533" fill="#9a9a9a">Recipes</text>
    <rect x="896" y="548" width="146" height="28" rx="14" fill="none" stroke="#b4b4b4" stroke-dasharray="4 3"/><text x="912" y="567" fill="#9a9a9a">component specs</text>
    <line x1="896" y1="626" x2="1192" y2="626" stroke="#e0e0e0"/>
    <text x="896" y="645" font-size="11" font-weight="600" fill="#a34a2e">Override is silent, permanent, and</text>
