  <line x1="274" y1="846" x2="302" y2="846" stroke="#477d85" stroke-width="1.6" marker-end="url(#arrJun)"/>
  <line x1="506" y1="846" x2="534" y2="846" stroke="#477d85" stroke-width="1.6" marker-end="url(#arrJun)"/>
