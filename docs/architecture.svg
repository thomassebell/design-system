<svg role="img" viewBox="0 0 1040 1000" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, sans-serif">
  <title>Sebell Design System — architecture &amp; CI</title>
  <desc>Top half (build pipeline): Figma is the source of truth for token values and brands.config.js is the single source of truth for the brand × density matrix. Figma exports DTCG JSON into figma-exports, which build.mjs reads (also reading brands.config.js) to merge foundation → semantic → density and resolve aliases, running build-time pre-flight checks (alias misalignment and cross-brand parity are fatal, near-name typos warn, plus a structural diff vs HEAD and a stale var() grep). build.mjs emits six CSS files (3 brands × 2 densities) consumed by @sebellds/react components (semantic tokens only, zero primitives), and one tokens.json that generate-swift turns into DesignTokens.swift for @sebellds/ios-tokens. Bottom half (CI pipeline, runs on every push and PR to main): eight ordered gates — tokens:build (pre-flight), build, lint (eslint + stylelint), typecheck (tsc --noEmit), test (vitest/jsdom), build-storybook, Chromatic visual regression across 6 modes, and an iOS output check that DesignTokens.swift exists — ending in a Vercel Storybook deploy and Chromatic baselines. stylelint forbids raw colours and any var(--primitive-…) in component CSS.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a87"/></marker>
    <marker id="arrPine" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3d5c40"/></marker>
    <marker id="arrJun" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#477d85"/></marker>
  </defs>

  <rect x="0" y="0" width="1040" height="1000" fill="#fafaf8"/>

  <!-- Title -->
  <text x="40" y="42" font-size="23" font-weight="700" fill="#0d0d0c">Sebell Design System — architecture &amp; CI</text>
  <text x="40" y="66" font-size="13" fill="#5a5a58">The token pipeline, what it produces, and every check that gates a change.</text>

  <!-- Legend -->
  <rect x="724" y="22" width="286" height="46" rx="8" fill="#ffffff" stroke="#e8e7e2"/>
  <rect x="738" y="37" width="15" height="15" rx="4" fill="#e7ede7" stroke="#3d5c40" stroke-width="1.5"/>
  <text x="760" y="49" font-size="11.5" fill="#0d0d0c">Source of truth</text>
  <rect x="884" y="37" width="15" height="15" rx="4" fill="#e8f1f2" stroke="#477d85" stroke-width="1.5"/>
  <text x="906" y="49" font-size="11.5" fill="#0d0d0c">Check / test</text>

  <!-- ===== ZONE A : BUILD PIPELINE ===== -->
  <text x="40" y="98" font-size="12" font-weight="700" letter-spacing="1.5" fill="#8a8a87">BUILD PIPELINE</text>

  <!-- arrows (under boxes) -->
  <line x1="160" y1="166" x2="160" y2="198" stroke="#8a8a87" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="160" y1="258" x2="160" y2="292" stroke="#8a8a87" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M430,172 C400,210 360,250 320,292" fill="none" stroke="#3d5c40" stroke-width="1.8" marker-end="url(#arrPine)"/>
  <text x="372" y="232" font-size="11" font-style="italic" fill="#3d5c40">reads</text>
  <path d="M346,328 L396,322" fill="none" stroke="#477d85" stroke-width="1.6" marker-end="url(#arrJun)"/>
  <line x1="150" y1="368" x2="150" y2="418" stroke="#8a8a87" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M250,368 C300,388 340,398 366,418" fill="none" stroke="#8a8a87" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="150" y1="486" x2="150" y2="514" stroke="#8a8a87" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="372" y1="486" x2="372" y2="514" stroke="#8a8a87" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- A1 Figma -->
  <rect x="55" y="108" width="200" height="58" rx="10" fill="#ffffff" stroke="#cfcec9"/>
  <text x="69" y="134" font-size="15" font-weight="700" fill="#0d0d0c">Figma</text>
  <text x="69" y="152" font-size="10.5" fill="#8a8a87">source of truth — token values</text>

  <!-- A2 brands.config.js (pine) -->
  <rect x="300" y="106" width="332" height="64" rx="10" fill="#e7ede7" stroke="#3d5c40" stroke-width="1.5"/>
  <text x="314" y="131" font-size="15" font-weight="700" fill="#0d0d0c">brands.config.js</text>
  <text x="314" y="149" font-size="10.5" fill="#2c4430">single source of truth — brands × densities</text>
  <text x="314" y="163" font-size="10.5" fill="#2c4430">feeds the build AND Storybook (preview.js)</text>

  <!-- A3 figma-exports -->
  <rect x="55" y="198" width="290" height="60" rx="10" fill="#ffffff" stroke="#e8e7e2"/>
  <text x="69" y="222" font-size="13.5" font-weight="600" fill="#0d0d0c">figma-exports/*.tokens.json</text>
  <text x="69" y="241" font-size="10.5" fill="#8a8a87">foundation · semantic · density (DTCG)</text>

  <!-- A4 build.mjs -->
  <rect x="55" y="292" width="290" height="76" rx="10" fill="#ffffff" stroke="#cfcec9"/>
  <text x="69" y="318" font-size="15" font-weight="700" fill="#0d0d0c">build.mjs</text>
  <text x="69" y="338" font-size="10.5" fill="#5a5a58">merge foundation → semantic → density</text>
  <text x="69" y="355" font-size="10.5" fill="#5a5a58">resolve Figma aliases at build time</text>

  <!-- Pre-flight checks callout (juniper) -->
  <rect x="398" y="198" width="442" height="150" rx="10" fill="#e8f1f2" stroke="#477d85" stroke-width="1.5"/>
  <text x="416" y="224" font-size="13" font-weight="700" fill="#2f5a61">Build-time pre-flight checks</text>
  <text x="416" y="249" font-size="11" fill="#0d0d0c">✓  alias misalignment (wrong-brand foundation) → fatal</text>
  <text x="416" y="272" font-size="11" fill="#0d0d0c">✓  cross-brand parity: same keys &amp; $type → fatal</text>
  <text x="416" y="295" font-size="11" fill="#0d0d0c">✓  Levenshtein near-name typo → warning</text>
  <text x="416" y="318" font-size="11" fill="#0d0d0c">✓  structural diff vs HEAD + stale var(--…) grep</text>
  <text x="416" y="337" font-size="10" font-style="italic" fill="#477d85">runs on every build — locally and in CI</text>

  <!-- A5 dist css -->
  <rect x="55" y="418" width="190" height="64" rx="10" fill="#ffffff" stroke="#e8e7e2"/>
  <text x="150" y="444" text-anchor="middle" font-size="14" font-weight="600" fill="#0d0d0c">dist/*.css</text>
  <text x="150" y="463" text-anchor="middle" font-size="10" fill="#8a8a87">6 files · 3 brands × 2 densities</text>

  <!-- A5b tokens.json -->
  <rect x="285" y="418" width="175" height="64" rx="10" fill="#ffffff" stroke="#e8e7e2"/>
  <text x="372" y="444" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0d0d0c">dist/tokens.json</text>
  <text x="372" y="463" text-anchor="middle" font-size="10" fill="#8a8a87">first combo → generate-swift</text>

  <!-- A6 @sebellds/react -->
  <rect x="55" y="514" width="190" height="78" rx="10" fill="#ffffff" stroke="#cfcec9"/>
  <text x="150" y="540" text-anchor="middle" font-size="14" font-weight="600" fill="#0d0d0c">@sebellds/react</text>
  <text x="150" y="559" text-anchor="middle" font-size="10" fill="#8a8a87">components consume</text>
  <text x="150" y="573" text-anchor="middle" font-size="10" fill="#8a8a87">semantic tokens only · 0 primitives</text>

  <!-- A6b swift -->
  <rect x="285" y="514" width="175" height="78" rx="10" fill="#ffffff" stroke="#cfcec9"/>
  <text x="372" y="540" text-anchor="middle" font-size="13" font-weight="600" fill="#0d0d0c">DesignTokens.swift</text>
  <text x="372" y="559" text-anchor="middle" font-size="10" fill="#8a8a87">@sebellds/ios-tokens</text>
  <text x="372" y="573" text-anchor="middle" font-size="10" fill="#8a8a87">SwiftUI package</text>

  <!-- ===== ZONE B : CI PIPELINE ===== -->
  <rect x="40" y="624" width="960" height="340" rx="12" fill="#f3f9f9" stroke="#477d85" stroke-width="1.5"/>
  <text x="64" y="660" font-size="15" font-weight="700" fill="#0d0d0c">CI pipeline — runs on every push &amp; pull request to <tspan font-family="ui-monospace, monospace" font-size="13">main</tspan></text>
  <text x="976" y="660" text-anchor="end" font-size="10.5" fill="#477d85">.github/workflows/ci.yml · Node 20</text>

  <!-- flow arrows row 1 -->
  <line x1="274" y1="728" x2="302" y2="728" stroke="#477d85" stroke-width="1.6" marker-end="url(#arrJun)"/>
  <line x1="506" y1="728" x2="534" y2="728" stroke="#477d85" stroke-width="1.6" marker-end="url(#arrJun)"/>
  <line x1="738" y1="728" x2="766" y2="728" stroke="#477d85" stroke-width="1.6" marker-end="url(#arrJun)"/>
  <!-- wrap arrow row1 -> row2 -->
  <path d="M868,762 L868,789 L172,789 L172,810" fill="none" stroke="#477d85" stroke-width="1.6" marker-end="url(#arrJun)"/>
