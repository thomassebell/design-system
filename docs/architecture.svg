  <!-- 2 build -->
  <rect x="304" y="694" width="200" height="68" rx="9" fill="#ffffff" stroke="#9ec4c9"/>
  <circle cx="326" cy="728" r="10" fill="#477d85"/><text x="326" y="732" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
  <text x="344" y="722" font-size="13" font-weight="700" fill="#0d0d0c">build</text>
  <text x="344" y="740" font-size="9.5" fill="#5a5a58">turbo · all packages</text>
