  <text x="576" y="858" font-size="9.5" fill="#5a5a58">visual regression · 6 modes</text>
  <!-- 8 iOS output check -->
  <rect x="768" y="812" width="200" height="68" rx="9" fill="#ffffff" stroke="#9ec4c9"/>
  <circle cx="790" cy="846" r="10" fill="#477d85"/><text x="790" y="850" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">8</text>
  <text x="808" y="840" font-size="13" font-weight="700" fill="#0d0d0c">iOS output check</text>
  <text x="808" y="858" font-size="9.5" fill="#5a5a58">DesignTokens.swift exists</text>

  <!-- outcomes + footnote -->
  <text x="64" y="908" font-size="11.5" fill="#2f5a61">→  Storybook deployed to <tspan font-weight="700">Vercel</tspan>  ·  <tspan font-weight="700">Chromatic</tspan> baselines: reviewed on PR, auto-accepted on main</text>
  <text x="64" y="932" font-size="10" fill="#5a5a58">*  stylelint: no raw colours (hex / rgb / hsl / named) and no <tspan font-family="ui-monospace, monospace">var(--primitive-…)</tspan> in component CSS — components consume semantic tokens only.</text>
</svg>
