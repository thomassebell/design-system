  <circle cx="790" cy="728" r="10" fill="#477d85"/><text x="790" y="732" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
  <text x="808" y="722" font-size="13" font-weight="700" fill="#0d0d0c">typecheck</text>
  <text x="808" y="740" font-size="9.5" fill="#5a5a58">tsc --noEmit</text>

  <!-- CI chips: row 2 -->
  <!-- 5 test -->
  <rect x="72" y="812" width="200" height="68" rx="9" fill="#ffffff" stroke="#9ec4c9"/>
  <circle cx="94" cy="846" r="10" fill="#477d85"/><text x="94" y="850" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text>
  <text x="112" y="840" font-size="13" font-weight="700" fill="#0d0d0c">test</text>
  <text x="112" y="858" font-size="9.5" fill="#5a5a58">vitest · jsdom</text>
  <!-- 6 build-storybook -->
  <rect x="304" y="812" width="200" height="68" rx="9" fill="#ffffff" stroke="#9ec4c9"/>
  <circle cx="326" cy="846" r="10" fill="#477d85"/><text x="326" y="850" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text>
  <text x="344" y="840" font-size="13" font-weight="700" fill="#0d0d0c">build-storybook</text>
  <text x="344" y="858" font-size="9.5" fill="#5a5a58">modes from brands.config.js</text>
