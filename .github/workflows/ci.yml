name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      - uses: actions/checkout@v4
        with:
          # Chromatic needs the full git history to detect baselines.
          fetch-depth: 0

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build tokens
        run: npm run tokens:build

      - name: Build all packages
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build Storybook
        run: npx turbo run build-storybook --filter=@ds/react

      - name: Chromatic
        uses: chromaui/action@v11
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/react
          storybookBuildDir: storybook-static
          exitZeroOnChanges: true
          autoAcceptChanges: main

      # Verify the Swift output was generated
      - name: Check iOS token output
        run: test -f packages/ios-tokens/output/DesignTokens.swift
