name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          # Chromatic needs the full git history to detect baselines.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build tokens
        run: npm run tokens:build

      - name: Build all packages
        run: npm run build

      # Consume @ds/tokens + @ds/react the way an external app would:
      # npm pack → install into a scratch project → import and verify the
      # documented entry points. Catches broken exports maps and lost CSS
      # Modules scoping that Storybook (which builds from src/) never sees.
      - name: Consumer smoke test
        run: npm run smoke

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build Storybook
        run: npx turbo run build-storybook --filter=@ds/react

      - name: Chromatic
        uses: chromaui/action@v17
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/react
          storybookBuildDir: storybook-static
          exitZeroOnChanges: true
          autoAcceptChanges: main

      # The Swift file is committed (SwiftPM consumes it from git). The token
      # build above regenerated it, so any diff means the committed copy is
      # stale – fail and ask for a rebuild + commit.
      - name: Check committed iOS tokens are up to date
        run: |
          git diff --exit-code -- packages/ios-tokens/Sources \
            || (echo "::error::DesignTokens.swift is out of date. Run 'npm run tokens:build' and commit the result." && exit 1)
